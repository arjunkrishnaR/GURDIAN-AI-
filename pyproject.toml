[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardianai"
version = "0.1.0"
description = "Autonomous Windows computer assistant for system monitoring, diagnosis, and recovery."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "GuardianAI Engineering Team"}
]
keywords = ["ai", "assistant", "windows", "diagnostics", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
guardian = "guardian.cli.commands:cli_main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

